{{- $tunnelID := required "cloudflared.tunnelConfig.name must be the existing tunnel UUID" .Values.cloudflared.tunnelConfig.name -}}
{{- if not (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $tunnelID) -}}
{{- fail "cloudflared.tunnelConfig.name must be a UUID, not a tunnel display name" -}}
{{- end -}}
{{- $accountTag := required "credentials.accountTag is required" .Values.credentials.accountTag -}}
{{- $tunnelSecret := required "credentials.tunnelSecret is required" .Values.credentials.tunnelSecret -}}
{{- $jsonSecret := .Values.cloudflared.tunnelSecrets.existingConfigJsonFileSecret -}}
{{- $pemSecret := .Values.cloudflared.tunnelSecrets.existingPemFileSecret -}}
{{- $secretName := required "cloudflared.tunnelSecrets.existingConfigJsonFileSecret.name is required" $jsonSecret.name -}}
{{- if ne $secretName $pemSecret.name -}}
{{- fail "both existing-Secret references must point to the wrapper-managed credentials Secret" -}}
{{- end -}}
{{- $jsonKey := required "cloudflared.tunnelSecrets.existingConfigJsonFileSecret.key is required" $jsonSecret.key -}}
{{- if eq $jsonKey $pemSecret.key -}}
{{- fail "the certificate path must not point to the credentials JSON key" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
type: Opaque
data:
  {{ $jsonKey | quote }}: {{ dict "AccountTag" $accountTag "TunnelID" $tunnelID "TunnelSecret" $tunnelSecret | toJson | b64enc | quote }}
