commonLabels:
  sync-stage: system
helmDefaults:
  atomic: true
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  timeout: 300
repositories:
- name: community-charts
  url: https://community-charts.github.io/helm-charts
releases:
- name: cloudflare-tunnel
  namespace: cloudflare
  chart: ./chart
  secrets:
  - secrets.yaml
  values:
  - values.yaml
