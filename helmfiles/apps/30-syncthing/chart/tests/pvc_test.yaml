---
suite: Syncthing persistent volume
templates:
  - templates/pvc.yaml
release:
  name: syncthing
  namespace: syncthing
tests:
  - it: uses an 8Gi claim as the chart default
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 8Gi
  - it: preserves the existing 20Gi RWO claim with homelab overrides
    values:
      - ../../values.yaml
    asserts:
      - equal:
          path: metadata.name
          value: syncthing
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi
      - notExists:
          path: spec.storageClassName
  - it: uses CI storage settings only when explicitly supplied
    values:
      - ../ci/default-values.yaml
    asserts:
      - equal:
          path: spec.storageClassName
          value: standard
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
