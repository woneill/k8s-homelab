---
suite: Syncthing deployment
templates:
  - templates/deployment.yaml
release:
  name: syncthing
  namespace: syncthing
tests:
  - it: uses the configured image tag for the image and version labels
    set:
      image.tag: "9.8.7"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: syncthing/syncthing:9.8.7
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "9.8.7"
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
          value: "9.8.7"
  - it: rejects an empty image tag
    set:
      image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: image.tag is required
  - it: preserves resource identity and the single-pod Recreate strategy
    asserts:
      - equal:
          path: metadata.name
          value: syncthing
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: syncthing
            app.kubernetes.io/instance: syncthing
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: syncthing
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: syncthing
  - it: keeps the existing PVC mounted at the Syncthing data directory
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: syncthing
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/syncthing
