replicaCount: 1

image:
  repository: syncthing/syncthing
  tag: "2.1.7-rc.3@sha256:fac4f53ecbcd3ecc7711b434e42b0fe42b8de170106510d45ddb1fb3e9f1b4c3"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Recreate prevents two pods from competing for the existing RWO volume.
updateStrategy:
  type: Recreate

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

containerPorts:
  http: 8384
  tcpSync: 22000
  quicSync: 22000
  discovery: 21027

service:
  type: LoadBalancer
  port:
    http: 80
    tcpSync: 22000
    quicSync: 22000
    discovery: 21027

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: syncthing.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /rest/noauth/health
    port: http
readinessProbe:
  httpGet:
    path: /rest/noauth/health
    port: http
  initialDelaySeconds: 10

persistence:
  enabled: true
  mountPath: "/var/syncthing"
  subPath: ""
  storageClass: ""
  annotations: {}
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  existingClaim: ""
  selector: {}
  dataSource: {}

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
