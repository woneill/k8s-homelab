---
name: Syncthing Chart

on:
  pull_request:
    paths:
      - 'helmfiles/apps/30-syncthing/**'
      - '.github/ct.yaml'
      - '.github/workflows/syncthing-chart.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and test Syncthing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          yamllint_version: "1.37.1"

      - name: Lint chart and run unit tests
        run: ct lint --config .github/ct.yaml

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Install chart and run Helm test hooks
        run: ct install --config .github/ct.yaml
