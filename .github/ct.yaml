---
remote: origin
target-branch: main
chart-dirs:
  - helmfiles/apps/30-syncthing
# Explicitly test the chart when the workflow detects relevant changes,
# including image-only Renovate updates.
charts:
  - helmfiles/apps/30-syncthing/chart
check-version-increment: false
validate-maintainers: false
helm-extra-args: --timeout 600s
additional-commands:
  - helm unittest -f tests/*_test.yaml {{ .Path }}
